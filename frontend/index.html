html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
header{background:var(--hdr);color:#fff;display:flex;gap:16px;align-items:center;padding:14px 28px;flex-wrap:wrap}

.pill{border-radius:999px;padding:2px 11px;font-size:13px;font-weight:600;white-space:nowrap;display:inline-block}
.High{background:var(--redbg);color:var(--red)}.Medium{background:var(--ambbg);color:var(--amb)}.Low{background:var(--lowbg);color:var(--mute)}
.mode{background:#3a2a05;color:#f2c26b}.mode.m{background:#0e3b3d;color:#7fe0e4}
main{max-width:1180px;margin:0 auto;padding:24px 28px 40px}
h1{font-size:28px;margin:0 0 4px;font-weight:600}h2{font-size:18px;margin:0 0 10px;font-weight:600}
.sub{color:var(--mute);margin:0 0 20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-bottom:20px}
.kpis .l{color:var(--mute);font-size:14px}.kpis .v{font-size:32px;font-weight:600}
.bar{height:6px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--teal)}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
button,select{font:inherit;font-weight:600;color:var(--teal);background:var(--card);border:1px solid var(--teal);border-radius:10px;padding:8px 16px;cursor:pointer}
button.on,button.pri{background:var(--teal);color:var(--card)}
button:focus-visible,select:focus-visible,a:focus-visible,tr:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--card)}
table{border-collapse:collapse;width:100%;min-width:820px}
th{text-align:left;color:var(--mute);font-weight:500;font-size:14px;padding:12px 14px}
td{padding:12px 14px;border-top:1px solid var(--line);vertical-align:middle}
tbody tr{cursor:pointer}tbody tr:hover{background:var(--bg)}
td small{display:block;color:var(--mute)}
a.open{color:var(--teal);font-weight:600;text-decoration:underline}
.note{color:var(--mute);font-size:13px;margin-top:14px}
.grid{display:grid;grid-template-columns:1.15fr 1fr;gap:16px}.col{display:grid;gap:16px;align-content:start}
@media(max-width:860px){.grid{grid-template-columns:1fr}header,main{padding-left:16px;padding-right:16px}}
.row{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid var(--line)}.row:first-of-type{border-top:0}
.ok{color:var(--ok);font-weight:600}.chk{color:var(--amb);font-weight:600}
svg{width:100%;height:auto;display:block}svg text{fill:var(--mute);font-size:11px;font-family:inherit}
.leg{display:flex;gap:16px;font-size:13px;color:var(--mute);margin-top:6px;flex-wrap:wrap}
.cmp div{margin:8px 0 2px}.cmp i{display:block;height:12px;border-radius:3px}
.ep{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:9px 0;border-top:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left;border-radius:0;color:var(--ink);font-weight:400}
.ep small{color:var(--mute)}
a.back{color:var(--teal)}
.hide{display:none}

 <div class="card"><h2>Why this home was flagged</h2>${c.reasons.map(r=>`<p style="margin:6px 0">${esc(r)}</p>`).join("")||"<p>No sustained anomaly.</p>"}${c.drivers&&c.drivers.length?`<p class="note" style="margin-top:12px">Model drivers (average contribution to the theft score on flagged readings):</p>${c.drivers.map(d=>`<div class="row"><span>${esc(d.f.replace(/_/g," "))}</span><b>+${d.v}</b></div>`).join("")}`:""}<p class="note">${c.episodes.length} flagged windows in total.</p></div>
 <div class="card"><h2>Could this be innocent?</h2>${inn.map(([a,b])=>`<div class="row"><span>${a}</span>${b}</div>`).join("")}</div>
 <div class="card"><h2>Suggested checks on site</h2>${checks.map((t,i)=>`<div>${i+1}. ${t}</div>`).join("")}
 <div class="tools" style="margin-top:14px"><select id="insp" aria-label="Inspector"><option>Inspector A</option><option>Inspector B</option><option>Inspector C</option></select><button class="pri" id="as">Assign inspector</button><select id="rs" aria-label="Dismiss reason"><option value="">Dismiss with reason…</option><option>Known load change</option><option>Vacant premises</option><option>Meter fault, not theft</option><option>Visited · no theft</option></select></div>
 ${store[c.id]?'<button id="rst">Reset status</button>':""}</div>
 </div></div><p class="note">Indicative lead for inspection. Verification on site is required before any action.</p>`;
 $("#bk").onclick=e=>{e.preventDefault();view="list";render()};
 $("#as").onclick=()=>{store[c.id]={s:"Assigned · "+$("#insp").value};save();detail()};
 $("#rs").onchange=e=>{if(e.target.value){store[c.id]={s:"Dismissed · "+e.target.value};save();detail()}};
 const rst=$("#rst");if(rst)rst.onclick=()=>{delete store[c.id];save();detail()};
 document.querySelectorAll("[data-w]").forEach(b=>b.onclick=()=>{win=b.dataset.w==="all"?{s:0,n:N}:{s:0,n:168};detail()});
 $("#pv").onclick=()=>{win.s=Math.max(0,win.s-Math.round(win.n/2));detail()};$("#nx").onclick=()=>{win.s=Math.min(N-win.n,win.s+Math.round(win.n/2));detail()};
 document.querySelectorAll(".ep").forEach(b=>b.onclick=()=>{const h=Math.round((new Date(b.dataset.s.replace(" ","T"))-new Date(c.t0.replace(" ","T")))/36e5);win={s:Math.max(0,Math.min(N-168,h-72)),n:168};detail();scrollTo(0,0)});
 const sv=$("#ch");sv.onmousemove=ev=>{const r=sv.getBoundingClientRect(),f=(ev.clientX-r.left)/r.width*640,i=Math.max(0,Math.min(win.n-1,Math.round((f-36)/(640-44)*(win.n-1)))),k=win.s+i;
  const d=new Date(new Date(c.t0.replace(" ","T")).getTime()+k*36e5);$("#tip").textContent=`${d.toLocaleString("en-IN",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit",hour12:false})} · actual ${c.actual[k]} kW · expected ${c.expected[k]} kW · theft probability ${Math.round(c.prob[k]*100)}%`}}
$("#file").onchange=async e=>{try{const j=JSON.parse(await e.target.files[0].text());if(!j.consumers)throw 0;D=j;view="list";filter="all";render()}catch(x){alert("That file is not a valid results.json from pipeline.py")}};
async function poll(){
 try{const r=await fetch(API+"/api/results");if(r.status===503){conn="wait";head();return}if(!r.ok)throw 0;
  const j=await r.json(),full=sel&&win.n===sel.actual.length;D=j;conn="ok";
  if(sel){sel=D.consumers.find(c=>c.id===sel.id)||sel;if(full)win.n=sel.actual.length}
  if(view==="list"||document.activeElement===document.body)render();else head()}
 catch(e){conn="err";head()}}
render();if(LIVE){poll();setInterval(poll,15000)}
</script></body></html>
